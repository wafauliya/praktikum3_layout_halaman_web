<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 3 - Layout dengan IFRAME</title>
  <link rel="stylesheet" href="style-iframe.css">
</head>
<body>
  <div class="halaman">
    <iframe class="f-header" src="header.html" title="Header"></iframe>
    <iframe class="f-menu" src="menu.html" title="Menu"></iframe>

    <iframe class="f-konten" src="praktikum1/02from.html" name="showframe" title="Konten"></iframe>
  </div>
</body>
